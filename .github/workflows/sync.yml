name: Sync from aperiodic.io

# Copies the published comparison from aperiodic.io/compare into data/, so the
# files here match the website. Changes on the website go through review there
# before they are published, so this job commits them directly.

on:
  schedule:
    # Daily, 05:23 UTC
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the published data
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crypto-data-vendors.json" https://aperiodic.io/compare/crypto-data-vendors.json
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crypto-data-vendors.csv" https://aperiodic.io/compare/crypto-data-vendors.csv

      - name: Check it before replacing anything
        run: |
          set -uo pipefail
          json="$RUNNER_TEMP/crypto-data-vendors.json"
          csv="$RUNNER_TEMP/crypto-data-vendors.csv"
          fail() {
            echo "::error::$1"
            echo "--- start of the JSON response:"; head -c 300 "$json"; echo
            echo "--- start of the CSV response:"; head -c 300 "$csv"; echo
            exit 1
          }
          jq -e '.cells | length > 0' "$json" > /dev/null || fail "The JSON has no cells, or is not JSON."
          jq -e '.disclosure and .updated' "$json" > /dev/null || fail "The JSON has no disclosure or updated date."
          header=$(head -n 1 "$csv" | tr -d '\r')
          [ "$header" = 'vendor_id,vendor,section,criterion_id,criterion,status,value,note,source_urls,checked' ] || fail "The CSV header is not the expected one."
          cp "$json" "$csv" data/

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data; then
            echo "Already in sync."
            exit 0
          fi
          updated=$(jq -r '.updated' data/crypto-data-vendors.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sync data from aperiodic.io/compare (updated $updated)"
          git push
